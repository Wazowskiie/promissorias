<div id="modalParcelas" class="modal hidden">
  <div class="modal-content modal-parcelas">
    <div class="modal-header">
      <div class="modal-header-info">
        <h3 id="modalParcelasCliente">Parcelas do Cliente</h3>
        <p id="modalParcelasObs" style="display:none;color:#6b7280;font-size:13px;margin:4px 0 0;"></p>
      </div>
      <button class="modal-close-btn" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body">
      <div id="listaParcelas"></div>
    </div>
    <div style="padding:12px 24px;border-top:1px solid #e5e7eb;">
      <button class="modal-close" onclick="fecharModal()">Fechar</button>
    </div>
  </div>
</div>

<div id="modalEditar" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-header-info">
        <h3 id="modalTitulo">Nova promissória</h3>
        <p>Preencha os dados abaixo</p>
      </div>
      <button class="modal-close-btn" onclick="fecharEditar()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-grid">
        <div class="form-group full-width"><label>Cliente</label><input type="text" id="editCliente" placeholder="Nome completo do cliente"></div>
        <div class="form-group"><label>Veículo</label><input type="text" id="editVeiculo" placeholder="Ex: POT4J62"></div>
        <div class="form-group"><label>Vendedor</label><input type="text" id="vendedor" placeholder="Nome do vendedor"></div>
        <div class="form-group"><label>Valor total</label><input type="number" id="editValor" placeholder="0,00"></div>
        <div class="form-group"><label>Valor da parcela</label><input type="number" id="valorPago" step="0.01" min="0" placeholder="0,00"></div>
        <div class="form-group"><label>Valor da Alienação/TCP</label><input type="number" id="valorAlienacao" step="0.01" min="0" placeholder="0,00"></div>        <div class="form-group"><label>Qtd. de parcelas</label><input type="number" id="editQtdParcelas" min="1" value="1"></div>
        <div class="form-group"><label>Data da Alienação/TCP</label><input type="date" id="editDataAlienacao"></div>
        <div class="form-group"><label>Data da Primeira Parcela</label><input type="date" id="editPrimeiraParcela"></div>
        <div class="form-group"><label>Data de vencimento</label><input type="date" id="editDataVencimento"></div>
        <div class="form-group full-width"><label>Observações</label><textarea id="observacoes" rows="2" placeholder="Informações adicionais..."></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancelar" onclick="fecharEditar()">Cancelar</button>
        <button class="btn-salvar" onclick="salvarEdicao()">Salvar promissória</button>
      </div>
    </div>
  </div>
</div>

<div id="modalPagamentoParcela" class="modal hidden">
  <div class="modal-content">
    <h3>Pagar Parcela</h3>
    <div class="form-group"><label>Valor</label><input type="number" id="valorPagamentoParcela" step="0.01"></div>
    <div class="form-actions">
      <button class="btn-pay" onclick="confirmarPagamentoParcela()">Confirmar Pagamento</button>
      <button class="btn-danger" onclick="fecharPagamentoParcela()">Cancelar</button>
    </div>
  </div>
</div>
