    <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Clientes – Milton Motos & Veículos</title>
  <link rel="stylesheet" href="../css/promissorias.css">
  <style>
    .page-header { margin-bottom: 1.5rem; }
    .page-header h2 { font-size: 20px; font-weight: 600; color: #111827; margin-bottom: 4px; }
    .page-header p { font-size: 13px; color: #6b7280; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat-card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 1rem 1.25rem; }
    .stat-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .stat-label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: 600; color: #111827; }

    .filters-row { display: flex; gap: 10px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .search-wrap { flex: 2; min-width: 200px; position: relative; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
    .search-wrap input { width: 100%; height: 38px; border-radius: 8px; border: 1px solid #d1d5db; padding: 0 12px 0 34px; font-size: 14px; color: #111827; background: #fff; box-sizing: border-box; }
    .filters-row select { height: 38px; border-radius: 8px; border: 1px solid #d1d5db; padding: 0 10px; font-size: 13px; color: #374151; background: #fff; flex: 1; min-width: 140px; }

    .section-label { font-size: 12px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }

    .clientes-lista { display: flex; flex-direction: column; gap: 8px; }
    .cliente-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem 1.25rem; cursor: pointer; transition: border-color 0.15s; }
    .cliente-card:hover { border-color: #9ca3af; }
    .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; position: relative; }
    .risk-dot { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: 1px; right: 1px; border: 2px solid #fff; }
    .risk-green { background: #16a34a; }
    .risk-yellow { background: #d97706; }
    .risk-red { background: #dc2626; }
    .cliente-info { flex: 1; min-width: 0; }
    .cliente-nome { font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cliente-sub { font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .dot-sep { width: 3px; height: 3px; border-radius: 50%; background: #9ca3af; display: inline-block; }
    .cliente-direita { text-align: right; flex-shrink: 0; }
    .cliente-valor { font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 5px; }
    .badges { display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 500; }
    .badge-red { background: #fef2f2; color: #991b1b; }
    .badge-blue { background: #eff6ff; color: #1e40af; }
    .badge-green { background: #f0fdf4; color: #166534; }
    .badge-amber { background: #fffbeb; color: #92400e; }
    .chevron { color: #9ca3af; margin-left: 8px; flex-shrink: 0; }

    .card-bottom { border-top: 1px solid #f3f4f6; padding-top: 10px; display: flex; align-items: center; gap: 12px; }
    .progress-wrap { flex: 1; }
    .progress-info { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; margin-bottom: 5px; }
    .progress-bar { height: 5px; background: #f3f4f6; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; }
    .last-pay { font-size: 11px; color: #6b7280; display: flex; align-items: center; gap: 4px; white-space: nowrap; }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal.hidden { display: none; }
    .modal-content { background: #fff; border-radius: 12px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 1.25rem 1.5rem; border-bottom: 1px solid #e5e7eb; }
    .modal-header h3 { font-size: 16px; font-weight: 600; color: #111827; }
    .modal-close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; line-height: 1; }
    .modal-body { padding: 1.25rem 1.5rem; }
    .prom-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin-bottom: 10px; }
    .prom-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .prom-veiculo { font-weight: 600; font-size: 14px; color: #111827; }
    .prom-valor { font-size: 13px; color: #374151; }
    .prom-info { font-size: 12px; color: #6b7280; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-ver-parcelas { margin-top: 10px; background: #1e40af; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    .btn-ver-parcelas:hover { background: #1d3a9e; }
    .empty-modal { color: #6b7280; font-size: 14px; text-align: center; padding: 2rem; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid #e5e7eb; }
    .btn-fechar { background: #f3f4f6; color: #374151; border: none; border-radius: 8px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
  </style>
</head>

    <div class="container">

      <div class="page-header">
        <h2>Clientes</h2>
        <p>Gerencie e acompanhe todos os clientes da loja</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon" style="background:#eff6ff">
            <svg width="16" height="16" fill="none" stroke="#1e40af" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="stat-label">Total de clientes</div>
          <div class="stat-value" id="statTotal">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:#fef2f2">
            <svg width="16" height="16" fill="none" stroke="#dc2626" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <div class="stat-label">Inadimplentes</div>
          <div class="stat-value" id="statInadimplentes" style="color:#dc2626">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:#fffbeb">
            <svg width="16" height="16" fill="none" stroke="#d97706" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-label">Com atenção</div>
          <div class="stat-value" id="statAtencao" style="color:#d97706">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:#f0fdf4">
            <svg width="16" height="16" fill="none" stroke="#16a34a" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <div class="stat-label">Total em aberto</div>
          <div class="stat-value" id="statAberto" style="font-size:15px">—</div>
        </div>
      </div>

      <div class="filters-row">
        <div class="search-wrap">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="buscaCliente" placeholder="Buscar por nome ou veículo..." oninput="aplicarFiltrosClientes()">
        </div>
        <select id="filtroStatusCliente" onchange="aplicarFiltrosClientes()">
          <option value="">Todos os status</option>
          <option value="inadimplente">Inadimplente</option>
          <option value="atencao">Com atenção</option>
          <option value="emdia">Em dia</option>
        </select>
        <select id="filtroVendedorCliente" onchange="aplicarFiltrosClientes()">
          <option value="">Todos os vendedores</option>
        </select>
        <select id="filtroOrdem" onchange="aplicarFiltrosClientes()">
          <option value="nome">Ordenar por nome</option>
          <option value="divida">Maior dívida</option>
          <option value="vencidas">Mais vencidas</option>
        </select>
      </div>

      <div class="section-label" id="labelContagem">Carregando...</div>
      <div class="clientes-lista" id="listaClientes"></div>

    </div>
